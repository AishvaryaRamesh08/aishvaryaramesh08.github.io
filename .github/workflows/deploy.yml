# Deploy_Workflow: builds the site and publishes it to the GitHub Pages user site
# https://aishvaryaramesh08.github.io (repository aishvaryaramesh08.github.io).
#
# - Runs only on pushes to main; other branches never publish (Req 2.6).
# - Typecheck, lint and tests run before the build; any failing step fails the
#   run, the deploy job (needs: build) is skipped and the live site stays
#   unchanged (Req 2.2, 32.5, 32.6).
# - cancel-in-progress keeps the newest main commit as the published version
#   (Req 2.7). deploy-pages swaps deployments atomically, so a cancelled run
#   never partially publishes.
# - Built with the default Base_Path "/". No custom domain or CNAME (Req 2.8).
# - Every action is pinned to a full commit SHA; the comment names the release.

name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and property tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
